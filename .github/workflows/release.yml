name: Build Windows EXE Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests before build
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build TunePro.exe
        run: python -X utf8 scripts/build_exe.py

      - name: Prepare release asset and checksum
        shell: pwsh
        run: |
          Copy-Item dist\TunePro.exe dist\TunePro-Windows-x64.exe
          $h = (Get-FileHash dist\TunePro-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TunePro-Windows-x64.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunePro-Windows-x64
          path: |
            dist/TunePro-Windows-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TunePro-Windows-x64.exe
            dist/SHA256SUMS.txt
